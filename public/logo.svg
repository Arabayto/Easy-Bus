<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1E1E28" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090B10" stop-opacity="1"/>
    </radialGradient>

    <!-- Gold Shield Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D26"/>
      <stop offset="50%" stop-color="#0F131A"/>
      <stop offset="100%" stop-color="#07090D"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#EAB308" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <g filter="url(#logoShadow)" transform="translate(100, 30)">
    <!-- Shield Outer Gold Border -->
    <path d="M 120 40 L 480 40 L 490 240 C 490 380, 340 480, 300 500 C 260 480, 110 380, 110 240 Z" 
          fill="url(#shieldFill)" 
          stroke="url(#goldGrad)" 
          stroke-width="16" 
          stroke-linejoin="round"/>

    <!-- Inner Shield Accent Line -->
    <path d="M 140 60 L 460 60 L 470 235 C 470 355, 335 445, 300 465 C 265 445, 130 355, 130 235 Z" 
          fill="none" 
          stroke="#EAB308" 
          stroke-width="3" 
          stroke-opacity="0.4"/>

    <!-- Speed Lines on the Left (Motion Blur effect) -->
    <path d="M 130 180 L 190 180 L 175 195 L 130 195 Z" fill="#EAB308" opacity="0.85"/>
    <path d="M 130 205 L 205 205 L 190 220 L 130 220 Z" fill="#EAB308" opacity="0.95"/>
    <path d="M 130 230 L 195 230 L 180 245 L 130 245 Z" fill="#EAB308" opacity="0.85"/>

    <!-- Highway Road Curve under Bus -->
    <path d="M 130 265 Q 300 270, 470 245 L 465 255 Q 300 280, 130 275 Z" fill="url(#goldGrad)"/>

    <!-- Dynamic Modern Bus (3/4 Front Angle View) -->
    <g transform="translate(150, 70)">
      <!-- Bus Upper Body -->
      <path d="M 30 140 L 60 70 C 65 60, 80 50, 105 45 L 250 25 C 280 22, 310 35, 315 55 L 325 150 C 325 165, 315 175, 290 180 L 70 180 C 40 180, 30 165, 30 140 Z" 
            fill="url(#busGrad)"/>

      <!-- Roof Top Dark Curve -->
      <path d="M 75 65 L 250 30 C 275 27, 295 38, 302 52 L 290 55 L 90 75 Z" fill="#A16207"/>

      <!-- Large Front Windshield (curved modern glass) -->
      <path d="M 215 40 L 295 35 C 308 35, 315 42, 312 60 L 305 130 C 303 140, 295 145, 280 145 L 210 145 C 205 145, 202 140, 204 130 L 215 40 Z" 
            fill="url(#windowGrad)" 
            stroke="#FEF08A" 
            stroke-width="2"/>

      <!-- Side Passenger Windows (streamlined) -->
      <path d="M 90 80 L 195 55 L 190 115 L 80 120 Z" fill="url(#windowGrad)"/>
      <line x1="125" y1="72" x2="118" y2="118" stroke="#CA8A04" stroke-width="2.5"/>
      <line x1="160" y1="64" x2="153" y2="116" stroke="#CA8A04" stroke-width="2.5"/>

      <!-- Headlights (Gleaming white/yellow with modern angle) -->
      <polygon points="280,140 298,138 295,147 278,146" fill="#FFFFFF"/>
      <polygon points="230,145 245,144 242,150 228,149" fill="#FFFFFF"/>

      <!-- Front Grille & Bumper -->
      <rect x="250" y="152" width="40" height="8" rx="3" fill="#1E293B"/>

      <!-- Front Wheels with 3D depth -->
      <ellipse cx="230" cy="180" rx="14" ry="22" fill="#0F172A" stroke="#EAB308" stroke-width="4"/>
      <ellipse cx="230" cy="180" rx="6" ry="10" fill="#EAB308"/>

      <!-- Rear Wheels -->
      <ellipse cx="90" cy="180" rx="12" ry="18" fill="#0F172A" stroke="#EAB308" stroke-width="3"/>
      <ellipse cx="90" cy="180" rx="5" ry="8" fill="#EAB308"/>

      <!-- Side Mirror -->
      <path d="M 315 70 Q 330 75, 325 95 L 320 95 Z" fill="#EAB308"/>
    </g>

    <!-- Typography: "Easy Bus" -->
    <!-- "Easy" in crisp pure white -->
    <text x="180" y="340" 
          font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
          font-size="62" 
          font-weight="900" 
          font-style="italic"
          fill="#FFFFFF" 
          letter-spacing="-1">Easy</text>

    <!-- "Bus" in gleaming Gold -->
    <text x="320" y="340" 
          font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
          font-size="62" 
          font-weight="900" 
          font-style="italic"
          fill="url(#goldGrad)" 
          letter-spacing="-1">Bus</text>

    <!-- Lower Dynamic Swoosh Banner -->
    <path d="M 115 370 Q 230 350, 450 420 Q 320 380, 150 400 Z" fill="url(#goldGrad)"/>

    <!-- Three 5-Point Rating Stars (★★★) -->
    <!-- Center Star -->
    <polygon points="300,390 305,403 319,403 308,411 312,424 300,416 288,424 292,411 281,403 295,403" fill="url(#goldGrad)"/>
    <!-- Left Star -->
    <polygon points="265,396 269,407 280,407 271,414 274,424 265,418 256,424 259,414 250,407 261,407" fill="url(#goldGrad)"/>
    <!-- Right Star -->
    <polygon points="335,396 339,407 350,407 341,414 344,424 335,418 326,424 329,414 320,407 331,407" fill="url(#goldGrad)"/>
  </g>
</svg>
